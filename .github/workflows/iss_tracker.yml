name: Run ISS Tracker

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Python Script
        env:
          USER_MAIL: ${{ secrets.USER_MAIL }}
          PSWD_MAIL: ${{ secrets.PSWD_MAIL }}
          SERV_MAIL: ${{ secrets.SERV_MAIL }}
          PORT_MAIL: ${{ secrets.PORT_MAIL }}
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LONG: ${{ secrets.HOME_LONG }}
        run: python day033/iss_tracker/main.py
